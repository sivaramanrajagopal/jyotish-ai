name: Keep API awake

# Render's free tier sleeps after 15 minutes idle, so the first phone visit
# waited about a minute. A ping every 10 minutes keeps the API warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://jyotish-ai-backend-rkd1.onrender.com/ping || true)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
