<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport: prevents zoom issues on iOS, fixes keyboard push-up ── -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- ── PWA / home screen ── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── iOS specific ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Parashara Jyotish" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />

    <!-- ── SEO / Social ── -->
    <title>Parashara Jyotish — Natal Chart · Dasha · Gochara · Panchangam</title>
    <meta name="description"
      content="Free Vedic natal chart (D1/D9), Vimshottari Dasha, Ashtakavarga, Gochara forecast with date picker, daily Panchangam, Tara Balam, and AI guidance." />
    <meta name="keywords" content="parashara jyotish, vedic astrology, panchangam, natal chart, vimshottari dasha, ashtakavarga, gochara, tara balam" />

    <!-- Open Graph -->
    <meta property="og:title" content="Parashara Jyotish — Vedic Natal Chart &amp; Forecast" />
    <meta property="og:description" content="D1/D9 charts, Dasha roadmap, Gochara scores, Panchangam, Ashtakavarga, and AI chat — Parashari system." />
    <meta property="og:type" content="website" />

    <!-- ── Prevent tap highlight flash on mobile ── -->
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html { background: #FFF8F0; }
      html[data-theme="dark"] { background: #0F1111; }
      body { margin: 0; overscroll-behavior: none; }
      #root { min-height: 100svh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
